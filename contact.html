<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Contact</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>

  <form class="form-contact" action="#" method="POST">
    <a href="index.html" class="btn-acceuil">acceuil</a>
    <h2>Nous contacter</h2>
    <p>Remplissez le formulaire pour nous envoyer un message</p>

    <div class="row">
      <div class="field">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" placeholder="Ex: Fotsing" required>
      </div>
      <div class="field">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" placeholder="Ex: Paul" required>
      </div>
    </div>

    <div class="field">
      <label for="email">Adresse mail</label>
      <input type="email" id="email" name="email" placeholder="paul@email.com" required>
    </div>

    <div class="field">
      <label for="tel">Numéro de téléphone</label>
      <input type="tel" id="tel" name="tel" placeholder="+237 6XX XX XX XX" required>
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="Votre message..." required></textarea>
    </div>

    <button type="submit">Envoyer le message</button>
  </form>

</body>
</html>
